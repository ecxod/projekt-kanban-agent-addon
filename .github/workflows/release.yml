name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: npm run build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Projekt Kanban Agent Connector ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/projekt-kanban-agent-${{ steps.package.outputs.version }}.xpi
            dist/projekt-kanban-agent-${{ steps.package.outputs.version }}-source.zip
            dist/projekt-kanban-agent-wsl.exe
            dist/SHA256SUMS
